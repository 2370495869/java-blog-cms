<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人账号 · 墨页博客</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-width workspace">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div th:if="${notice != null}" th:class="${noticeError == true} ? 'alert alert-error' : 'alert alert-success'" th:text="${notice}">账号设置已更新。</div>
  <section class="workspace-heading">
    <div><p class="eyebrow">YOUR ACCOUNT</p><h1>个人账号</h1><p class="muted">登录名 <code th:text="${viewer.username}">username</code> · 角色 <span th:text="${@viewLabels.role(viewer.user.role)}">作者</span></p></div>
  </section>
  <section class="panel">
    <h2>显示名称</h2>
    <p class="muted">这个名称会显示在工作台和内容记录中。</p>
    <form th:action="@{/account/profile/display-name}" method="post" th:object="${displayForm}" class="stack-form">
      <label>显示名称<input th:field="*{displayName}" maxlength="80" required autocomplete="name"></label>
      <div class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">显示名称无效。</div>
      <button class="button button-primary" type="submit">保存显示名称</button>
    </form>
  </section>
  <section class="panel">
    <h2>修改密码</h2>
    <p class="muted">先验证当前密码。新密码至少 12 个字符，UTF-8 编码后最多 72 字节。</p>
    <form th:action="@{/account/profile/password}" method="post" class="stack-form">
      <label>当前密码<input name="currentPassword" type="password" required autocomplete="current-password"></label>
      <label>新密码<input name="newPassword" type="password" minlength="12" maxlength="72" required autocomplete="new-password"></label>
      <label>确认新密码<input name="passwordConfirmation" type="password" minlength="12" maxlength="72" required autocomplete="new-password"></label>
      <button class="button button-primary" type="submit">更新密码</button>
    </form>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
