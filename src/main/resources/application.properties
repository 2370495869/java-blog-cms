spring.application.name=java-blog-cms

server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/blog-cms;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.site-title=${BLOG_SITE_TITLE:\u58a8\u9875\u535a\u5ba2}
app.bootstrap-admin.username=${BLOG_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BLOG_ADMIN_PASSWORD:}
