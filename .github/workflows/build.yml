name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: ./mvnw -B -ntp verify
      - name: Docker Compose build and HTTP smoke check
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password-2026
          MYSQL_PASSWORD: ci-only-blog-password-2026
          BLOG_ADMIN_USERNAME: ci_admin
          BLOG_ADMIN_PASSWORD: ci-only-admin-password-2026
          PORT: '18080'
        run: |
          docker compose up --build --detach --wait --wait-timeout 240
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/actuator/health)" = '200'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)" = '200'
      - name: Stop Compose stack
        if: always()
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password-2026
          MYSQL_PASSWORD: ci-only-blog-password-2026
          BLOG_ADMIN_USERNAME: ci_admin
          BLOG_ADMIN_PASSWORD: ci-only-admin-password-2026
          PORT: '18080'
        run: docker compose down --volumes
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
